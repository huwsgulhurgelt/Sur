<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Нийтлэл нэмэх — ОМС</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page-header">
  <a href="posts.html" class="back-link">← Нийтлэлүүд рүү буцах</a>
  <h1>+ Нийтлэл нэмэх</h1>
</div>

<div class="form-page">
  <div class="form-box">
    <h2>Шинэ нийтлэл оруулах</h2>

    <div class="form-row">
      <label>Таны нэр (заавал биш)</label>
      <input type="text" id="f-name" placeholder="Жишээ: Болд" />
    </div>

    <div class="form-row">
      <label>Хичээл / Ангилал *</label>
      <select id="f-subject"></select>
    </div>

    <div class="form-row">
      <label>Гарчиг *</label>
      <input type="text" id="f-title" placeholder="Нийтлэлийн гарчиг..." />
    </div>

    <div class="form-row">
      <label>Агуулга *</label>
      <textarea id="f-body" placeholder="Зөвлөмж, туршлага, судалгаа — хэрэгтэй зүйл бичнэ үү..."></textarea>
    </div>

    <button class="btn btn-primary" onclick="submitPost()">Нийтлэх</button>
    <span id="f-error" class="form-error"></span>
    <div id="f-success" class="form-success">✓ Нийтлэл амжилттай нэмэгдлээ! <a href="posts.html">Нийтлэлүүд харах →</a></div>
  </div>
</div>

<script src="js/data.js"></script>
<script>
// Build subject dropdown from TOPICS
const sel = document.getElementById("f-subject");
TOPICS.forEach(t => {
  const opt = document.createElement("option");
  opt.value = t.label;
  opt.textContent = t.label;
  sel.appendChild(opt);
});
// Add a generic option too
const other = document.createElement("option");
other.value = "Бусад";
other.textContent = "Бусад";
sel.appendChild(other);

function submitPost() {
  const name    = document.getElementById("f-name").value.trim();
  const subject = document.getElementById("f-subject").value;
  const title   = document.getElementById("f-title").value.trim();
  const body    = document.getElementById("f-body").value.trim();
  const errEl   = document.getElementById("f-error");
  const sucEl   = document.getElementById("f-success");

  if (!title || !body) {
    errEl.textContent = "Гарчиг болон агуулга заавал бөглөнө үү.";
    return;
  }
  errEl.textContent = "";

  const now = new Date();
  const dateStr = now.toLocaleDateString("mn-MN") + " " +
    now.toLocaleTimeString("mn-MN", { hour:"2-digit", minute:"2-digit" });

  const posts = getPosts();
  posts.push({ name: name || "Нэргүй", subject, title, body, date: dateStr });
  savePosts(posts);

  document.getElementById("f-name").value  = "";
  document.getElementById("f-title").value = "";
  document.getElementById("f-body").value  = "";
  sucEl.style.display = "block";

  // Auto redirect after 2s
  setTimeout(() => { window.location.href = "posts.html"; }, 2000);
}
</script>
</body>
</html>
