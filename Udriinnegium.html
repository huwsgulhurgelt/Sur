<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{var _t=JSON.parse(localStorage.getItem('site-theme')||'null');if(_t&&_t.bg){document.documentElement.style.background=_t.bg;document.documentElement.style.backgroundAttachment='fixed';}}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Udriinnegium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="study-style.css">
  <style>
    .udri-wrap {
      min-height: 80vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; padding: 40px 24px; text-align: center;
    }
    .udri-title {
      font-size: 2rem; font-weight: 900;
      margin: 0 0 4px;
    }
    .udri-sub {
      font-size: 0.9rem; color: var(--muted);
      margin: 0 0 32px;
    }
    .udri-btns {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%; max-width: 320px;
    }
    .udri-btn {
      display: block; width: 100%;
      padding: 14px 22px;
      background: var(--surface); border: var(--bw) solid var(--border);
      border-radius: var(--radius); font-size: 0.92rem; font-weight: 800;
      color: var(--text); text-decoration: none; text-align: center;
      cursor: pointer; font-family: inherit;
      box-shadow: var(--shadow);
      transition: all 200ms ease;
    }
    .udri-btn:hover {
      border-color: var(--accent); color: var(--accent);
      transform: translateY(-2px); box-shadow: var(--shadow-hover);
    }
    .udri-btn.primary {
      background: var(--accent); color: #fff; border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(var(--accent-rgb),0.35);
    }
    .udri-btn.primary:hover {
      color: #fff;
      box-shadow: 0 8px 22px rgba(var(--accent-rgb),0.45);
    }
  </style>
</head>
<body>

  <div class="udri-wrap">
    <h1 class="udri-title">Udriinnegium</h1>
    <p class="udri-sub">More coming soon.</p>

    <div class="udri-btns">
      <!-- Add your buttons below. More will be added later. -->
      <a href="index.html" class="udri-btn">← Back to Home</a>
    </div>
  </div>

  <script src="theme-switcher.js"></script>
  <script src="page-transition.js"></script>
</body>
</html>
