<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Зөвлөмжүүд — ОМС</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page-header">
  <a href="index.html" class="back-link">← Нүүр хуудас</a>
  <h1>📚 Зөвлөмжүүд</h1>
</div>

<div class="topics-page">

  <!-- Category filter bar -->
  <div class="cat-bar">
    <button class="cat-btn active" data-type="all">🔷 Бүгд</button>
    <button class="cat-btn" data-type="study">📌 Суралцах зөвлөмж</button>
    <button class="cat-btn" data-type="curve">📈 Суралцах муруй</button>
    <button class="cat-btn" data-type="english">🔤 Англи үгс</button>
    <button class="cat-btn" data-type="eye">👁 Нүдний зөвлөмж</button>
  </div>

  <!-- Subject filter (all subjects) -->
  <div class="cat-bar" id="subject-bar">
    <button class="cat-btn active" data-subject="all">📖 Бүх хичээл</button>
    <!-- built by JS -->
  </div>

  <div id="results-count" style="font-size:12px;margin-bottom:8px;"></div>
  <div id="topics-grid" class="topics-grid"></div>

</div>

<script src="js/data.js"></script>
<script>
let activeType    = "all";
let activeSubject = "all";

// Build subject buttons
const subjectBar = document.getElementById("subject-bar");
TOPICS.forEach(t => {
  const btn = document.createElement("button");
  btn.className = "cat-btn";
  btn.dataset.subject = t.id;
  btn.textContent = t.label;
  btn.addEventListener("click", function() {
    subjectBar.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    activeSubject = this.dataset.subject;
    renderGrid();
  });
  subjectBar.appendChild(btn);
});

// Type filter buttons
document.querySelectorAll(".cat-bar[data-type] .cat-btn, .cat-bar:first-of-type .cat-btn").forEach(btn => {
  if (btn.dataset.type !== undefined) {
    btn.addEventListener("click", function() {
      document.querySelectorAll(".cat-bar:first-of-type .cat-btn").forEach(b => b.classList.remove("active"));
      this.classList.add("active");
      activeType = this.dataset.type;
      renderGrid();
    });
  }
});

// Simpler: attach to first cat-bar
document.querySelector(".cat-bar").querySelectorAll(".cat-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelector(".cat-bar").querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    activeType = this.dataset.type;
    renderGrid();
  });
});

function renderGrid() {
  const grid = document.getElementById("topics-grid");
  const countEl = document.getElementById("results-count");
  grid.innerHTML = "";

  let count = 0;

  TOPICS.forEach(t => {
    if (activeSubject !== "all" && t.id !== activeSubject) return;

    t.cards.forEach(card => {
      if (activeType !== "all" && card.type !== activeType) return;

      count++;
      const el = document.createElement("div");
      el.className = "topic-card";

      const header = document.createElement("div");
      header.className = "topic-card-header";
      header.innerHTML = `
        <span class="topic-card-type">${escHtml(TYPE_LABELS[card.type] || card.type)}</span>
        <div class="topic-card-title">${escHtml(card.title)}</div>
        <span class="topic-card-subject">${escHtml(t.label)}</span>
      `;
      el.appendChild(header);

      const ul = document.createElement("ul");
      ul.className = "topic-card-items";
      card.items.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        ul.appendChild(li);
      });
      el.appendChild(ul);

      grid.appendChild(el);
    });
  });

  if (!count) {
    grid.innerHTML = '<div class="no-topics">Энэ ангилалд мэдлэг байхгүй байна.</div>';
  }
  countEl.textContent = count + " карт харуулж байна";
}

renderGrid();
</script>
</body>
</html>
