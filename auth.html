  <style>
    .auth-wrap {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: var(--bw) solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(
        90deg,
        var(--accent),
        var(--accent2, var(--accent))
      );
    }

    .auth-tabs {
      display: flex;
      border-bottom: var(--bw) solid var(--border);
      background: var(--surface2, var(--bg));
    }

    .auth-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      transition: all 200ms ease;
      border-bottom: 2px solid transparent;
    }

    .auth-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--surface);
    }

    .auth-body {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .auth-title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 2px;
    }

    .auth-sub {
      font-size: 0.86rem;
      color: var(--muted);
    }

    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .avatar-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px dashed var(--border-strong, var(--border));
      background: var(--surface2, var(--bg));
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 200ms, transform 200ms;
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .avatar-ring:hover {
      border-color: var(--accent);
      transform: scale(1.04);
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
    }

    .avatar-hint {
      font-size: 0.74rem;
      color: var(--muted);
      text-align: center;
    }

    #avatarInput {
      display: none;
    }

    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .auth-field label {
      font-size: 0.84rem;
      font-weight: 700;
    }

    .auth-field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: var(--bw) solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 200ms, box-shadow 200ms;
      box-sizing: border-box;
    }

    .auth-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb, 45, 58, 140), 0.12);
    }

    .auth-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 200ms ease;
      letter-spacing: 0.02em;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .auth-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .auth-google {
      width: 100%;
      padding: 12px;
      background: var(--surface);
      border: var(--bw) solid var(--border);
      border-radius: var(--radius);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 200ms ease;
    }

    .auth-google:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .auth-google:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .auth-error {
      font-size: 0.82rem;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      display: none;
    }

    .auth-error.show {
      display: block;
    }

    .auth-success {
      font-size: 0.82rem;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      display: none;
      text-align: center;
    }

    .auth-success.show {
      display: block;
    }

    .profile-card {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 36px;
      text-align: center;
    }

    .profile-card.show {
      display: flex;
    }

    .profile-av {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      background: var(--surface2, var(--bg));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
      overflow: hidden;
      flex-shrink: 0;
    }

    .profile-av img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-name {
      font-size: 1.15rem;
      font-weight: 900;
    }

    .profile-email {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .profile-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .plink {
      padding: 9px 20px;
      border-radius: var(--radius);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 200ms ease;
    }

    .plink.primary {
      background: var(--accent);
      color: #fff;
      border: none;
    }

    .plink.primary:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .plink.ghost {
      background: none;
      color: var(--muted);
      border: var(--bw) solid var(--border);
    }

    .plink.ghost:hover {
      border-color: var(--accent);
      color: var(--text);
    }
  </style>

  <script type="module">

    import {
      auth,
      db
    } from './firebase-config.js';


    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      updateProfile,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


    import {
      doc,
      setDoc,
      getDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


    // =========================================
    // GOOGLE PROVIDER
    // =========================================

    const provider = new GoogleAuthProvider();


    // =========================================
    // AVATAR
    // =========================================

    let avatarDataUrl = null;


    document
      .getElementById('avatarRing')
      .addEventListener('click', function() {

        document
          .getElementById('avatarInput')
          .click();

      });


    document
      .getElementById('avatarInput')
      .addEventListener('change', function() {

        const file = this.files[0];

        if (!file) {
          return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {

          avatarDataUrl = e.target.result;

          const ring =
            document.getElementById('avatarRing');

          ring.innerHTML = '';

          const img =
            document.createElement('img');

          img.src = avatarDataUrl;

          ring.appendChild(img);

        };

        reader.readAsDataURL(file);

      });


    // =========================================
    // CREATE / ENSURE FIRESTORE USER
    // =========================================
    //
    // This is the important part.
    //
    // Every newly created Firebase Auth account
    // gets a Firestore users/{uid} document.
    //
    // Existing documents are NOT overwritten.
    //

    async function ensureUserDocument(user) {

      if (!user) {
        return;
      }

      const userRef =
        doc(db, 'users', user.uid);

      const userSnap =
        await getDoc(userRef);


      if (!userSnap.exists()) {

        await setDoc(userRef, {

          displayName:
            user.displayName || '',

          photoURL:
            user.photoURL || '',

          rank:
            'user',

          nameChanges:
            [],

          postTimes:
            [],

          commentTimes:
            [],

          createdAt:
            serverTimestamp()

        });

        console.log(
          'Created Firestore user document:',
          user.uid
        );

      } else {

        console.log(
          'Firestore user document already exists:',
          user.uid
        );

      }

    }


    // =========================================
    // TAB SWITCHING
    // =========================================

    window.switchTab = function(tab) {

      const signin =
        tab === 'signin';


      document
        .getElementById('tabSignIn')
        .classList.toggle(
          'active',
          signin
        );


      document
        .getElementById('tabSignUp')
        .classList.toggle(
          'active',
          !signin
        );


      document
        .getElementById('formSignIn')
        .style.display =
          signin ? 'flex' : 'none';


      document
        .getElementById('formSignUp')
        .style.display =
          !signin ? 'flex' : 'none';


      clearErrors();

    };


    // =========================================
    // CLEAR ERRORS
    // =========================================

    function clearErrors() {

      [
        'siError',
        'suError',
        'suSuccess'
      ].forEach(function(id) {

        const el =
          document.getElementById(id);

        if (el) {

          el.classList.remove('show');

          el.textContent = '';

        }

      });

    }


    // =========================================
    // SHOW ERROR
    // =========================================

    function showErr(id, msg) {

      const el =
        document.getElementById(id);

      if (!el) {
        return;
      }

      el.textContent = msg;

      el.classList.add('show');

    }


    // =========================================
    // FIREBASE ERROR TRANSLATION
    // =========================================

    function friendly(code) {

      const map = {

        'auth/email-already-in-use':
          'That email is already registered. Try signing in instead.',

        'auth/invalid-email':
          'Please enter a valid email address.',

        'auth/weak-password':
          'Password must be at least 6 characters.',

        'auth/user-not-found':
          'No account found with that email.',

        'auth/wrong-password':
          'Incorrect password. Try again.',

        'auth/invalid-credential':
          'Incorrect email or password.',

        'auth/too-many-requests':
          'Too many attempts. Please wait a moment.',

        'auth/popup-closed-by-user':
          'Google sign-in was cancelled.',

        'auth/popup-blocked':
          'Your browser blocked the Google popup. Please allow popups for this site.',

        'auth/network-request-failed':
          'Network error. Check your connection.',

        'auth/operation-not-allowed':
          'This sign-in method is not enabled in Firebase Authentication.',

        'auth/user-disabled':
          'This account has been disabled.',

        'auth/requires-recent-login':
          'Please sign out and sign in again.'

      };


      return (
        map[code] ||
        ('Error: ' + (code || 'unknown'))
      );

    }


    // =========================================
    // EMAIL SIGN IN
    // =========================================

    document
      .getElementById('siBtn')
      .addEventListener('click', async function() {

        const email =
          document
            .getElementById('siEmail')
            .value
            .trim();


        const pass =
          document
            .getElementById('siPass')
            .value;


        clearErrors();


        if (!email) {

          showErr(
            'siError',
            'Please enter your email.'
          );

          return;

        }


        if (!pass) {

          showErr(
            'siError',
            'Please enter your password.'
          );

          return;

        }


        const button = this;

        button.disabled = true;

        button.textContent =
          'Signing in…';


        try {

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email,
              pass
            );


          // Make sure older accounts that somehow
          // don't have a Firestore document get one.
          await ensureUserDocument(
            credential.user
          );


          window.location.href =
            'index.html';


        } catch(e) {

          console.error(
            'Email sign-in error:',
            e
          );


          showErr(
            'siError',
            friendly(e.code)
          );


          button.disabled = false;

          button.textContent =
            'Sign In';

        }

      });


    // =========================================
    // EMAIL SIGN UP
    // =========================================

    document
      .getElementById('suBtn')
      .addEventListener('click', async function() {

        const name =
          document
            .getElementById('suName')
            .value
            .trim();


        const email =
          document
            .getElementById('suEmail')
            .value
            .trim();


        const pass =
          document
            .getElementById('suPass')
            .value;


        clearErrors();


        if (!name) {

          showErr(
            'suError',
            'Please enter a display name.'
          );

          return;

        }


        if (!email) {

          showErr(
            'suError',
            'Please enter your email.'
          );

          return;

        }


        if (pass.length < 6) {

          showErr(
            'suError',
            'Password must be at least 6 characters.'
          );

          return;

        }


        const button = this;

        button.disabled = true;

        button.textContent =
          'Creating account…';


        try {

          // Create Firebase Authentication account
          const credential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              pass
            );


          // Set Firebase display name
          await updateProfile(
            credential.user,
            {
              displayName: name
            }
          );


          // Create Firestore user document
          await ensureUserDocument(
            credential.user
          );


          // Show success
          const success =
            document.getElementById(
              'suSuccess'
            );


          success.textContent =
            '✓ Account created! Redirecting…';


          success.classList.add('show');


          // Go to homepage
          setTimeout(function() {

            window.location.href =
              'index.html';

          }, 800);


        } catch(e) {

          console.error(
            'Email signup error:',
            e
          );


          showErr(
            'suError',
            friendly(e.code)
          );


          button.disabled = false;

          button.textContent =
            'Create Account';

        }

      });


    // =========================================
    // GOOGLE LOGIN / ACCOUNT CREATION
    // =========================================

    async function doGoogle(errorId) {

      clearErrors();


      try {

        // Firebase automatically creates the
        // Firebase Authentication account if
        // this Google account is new.
        const result =
          await signInWithPopup(
            auth,
            provider
          );


        // Create Firestore profile only if
        // this user doesn't already have one.
        await ensureUserDocument(
          result.user
        );


        window.location.href =
          'index.html';


      } catch(e) {

        console.error(
          'Google authentication error:',
          e
        );


        if (
          e.code !==
          'auth/popup-closed-by-user'
        ) {

          showErr(
            errorId,
            friendly(e.code)
          );

        }

      }

    }


    // Google from Sign In
    document
      .getElementById('siGoogleBtn')
      .addEventListener(
        'click',
        function() {

          doGoogle('siError');

        }
      );


    // Google from Create Account
    document
      .getElementById('suGoogleBtn')
      .addEventListener(
        'click',
        function() {

          doGoogle('suError');

        }
      );


    // =========================================
    // SIGN OUT
    // =========================================

    document
      .getElementById('signOutBtn')
      .addEventListener(
        'click',
        async function() {

          try {

            await signOut(auth);

          } catch(e) {

            console.error(
              'Sign out error:',
              e
            );

          }

        }
      );


    // =========================================
    // AUTH STATE
    // =========================================

    onAuthStateChanged(
      auth,
      async function(user) {

        const profileCard =
          document.getElementById(
            'profileCard'
          );


        const authForms =
          document.getElementById(
            'authForms'
          );


        if (user) {

          // Make sure the Firestore document
          // exists even for older accounts.
          try {

            await ensureUserDocument(
              user
            );

          } catch(e) {

            console.error(
              'Could not ensure user document:',
              e
            );

          }


          authForms.style.display =
            'none';


          profileCard.classList.add(
            'show'
          );


          document
            .getElementById('profileName')
            .textContent =
              user.displayName ||
              'Anonymous';


          document
            .getElementById('profileEmail')
            .textContent =
              user.email || '';


          const avatar =
            document.getElementById(
              'profileAv'
            );


          if (user.photoURL) {

            avatar.innerHTML =
              '<img src="' +
              user.photoURL +
              '" alt="">';

          } else {

            const initials =
              (
                user.displayName ||
                user.email ||
                '?'
              )
              .trim()
              .split(' ')
              .map(function(word) {
                return word[0];
              })
              .join('')
              .slice(0, 2)
              .toUpperCase();


            avatar.textContent =
              initials;

          }

        } else {

          authForms.style.display =
            'block';


          profileCard.classList.remove(
            'show'
          );

        }

      }
    );


    // =========================================
    // ENTER KEY
    // =========================================

    document
      .getElementById('siPass')
      .addEventListener(
        'keydown',
        function(e) {

          if (e.key === 'Enter') {

            document
              .getElementById('siBtn')
              .click();

          }

        }
      );


    document
      .getElementById('suPass')
      .addEventListener(
        'keydown',
        function(e) {

          if (e.key === 'Enter') {

            document
              .getElementById('suBtn')
              .click();

          }

        }
      );

  </script>


  <script src="page-transition.js"></script>
  <script src="nav.js"></script>

</body>
</html>
